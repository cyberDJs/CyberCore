<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title desc">
  <title id="title">CyberCore architecture at a glance</title>
  <desc id="desc">Four deliberately separated concerns: Interfaces, Core reasoning, Operational domains, Providers and drivers, with human approval before consequential mutation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3f5874" flood-opacity="0.12"/></filter>
    <linearGradient id="cyanBar" x1="0" x2="1"><stop offset="0" stop-color="#11A8C9"/><stop offset="1" stop-color="#29C0DB"/></linearGradient>
    <linearGradient id="blueBar" x1="0" x2="1"><stop offset="0" stop-color="#2E8DFF"/><stop offset="1" stop-color="#70A9FF"/></linearGradient>
    <linearGradient id="limeBar" x1="0" x2="1"><stop offset="0" stop-color="#7FD000"/><stop offset="1" stop-color="#A8DB32"/></linearGradient>
    <linearGradient id="tealBar" x1="0" x2="1"><stop offset="0" stop-color="#0AA49A"/><stop offset="1" stop-color="#24C2B5"/></linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#071943}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#15294d}
      .card{fill:#fff;stroke-width:1.5}
      .label{font-size:52px;font-weight:700}
      .copy{font-size:28px;font-weight:400}
      .arrow{stroke:#223959;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
    </style>
  </defs>
  <rect width="1448" height="1086" fill="#fff"/>

  <text x="170" y="83" class="t" font-size="68" font-weight="800">CyberCore architecture at a glance</text>
  <line x1="200" y1="133" x2="405" y2="133" stroke="#17AFC7" stroke-width="2"/>
  <circle cx="405" cy="133" r="5" fill="#17AFC7"/>
  <text x="432" y="147" class="sub" font-size="38">Four deliberately separated concerns</text>
  <circle cx="1042" cy="133" r="5" fill="#17AFC7"/>
  <line x1="1042" y1="133" x2="1230" y2="133" stroke="#17AFC7" stroke-width="2"/>

  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="195" y="184" width="1015" height="158" rx="20" class="card" stroke="#27B5D1"/>
    <rect x="195" y="184" width="15" height="158" rx="13" fill="url(#cyanBar)"/>
  </g>
  <circle cx="300" cy="263" r="58" fill="#F4FBFD" stroke="#62C7D9" stroke-width="1.5"/>
  <g stroke="#071943" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="246" r="18"/>
    <path d="M273 296v-12c0-13 10-24 24-24h6c14 0 24 11 24 24v12z"/>
  </g>
  <text x="412" y="261" class="t label">Interfaces</text>
  <text x="414" y="302" class="sub copy">Human, CLI, automation, and AI-assisted interaction</text>

  <path class="arrow" d="M702 344v36m-13-13l13 14 13-14"/>

  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="195" y="388" width="1015" height="156" rx="20" class="card" stroke="#62A0FF"/>
    <rect x="195" y="388" width="15" height="156" rx="13" fill="url(#blueBar)"/>
  </g>
  <circle cx="300" cy="466" r="58" fill="#F4F8FF" stroke="#79AAFF" stroke-width="1.5"/>
  <g stroke="#1760C8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M285 439c-14 0-23 9-23 20 0 7 4 12 9 16-5 3-8 9-8 15 0 10 8 18 18 18h7v-69z"/>
    <path d="M288 439c9 0 16 6 16 14v44c0 7-6 12-16 12"/>
    <path d="M304 450h16m0 0v-9m0 9v18m-16 9h25m-9 0v-9m9 9v18m-25 1h16"/>
    <circle cx="329" cy="441" r="4" fill="#1760C8"/><circle cx="338" cy="477" r="4" fill="#1760C8"/><circle cx="329" cy="496" r="4" fill="#1760C8"/>
  </g>
  <text x="412" y="462" class="t label">Core reasoning</text>
  <text x="414" y="506" class="sub copy">Evidence, context, knowledge, confidence, policy, and decisions</text>

  <path class="arrow" d="M702 546v36m-13-13l13 14 13-14"/>

  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="195" y="592" width="1015" height="155" rx="20" class="card" stroke="#A4D945"/>
    <rect x="195" y="592" width="15" height="155" rx="13" fill="url(#limeBar)"/>
  </g>
  <circle cx="300" cy="670" r="58" fill="#FAFFF2" stroke="#B9DD65" stroke-width="1.5"/>
  <g stroke="#4A8300" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 626l32 13v25c0 22-13 39-32 49-19-10-32-27-32-49v-25z"/>
    <path d="M282 670l12 12 25-27"/>
  </g>
  <text x="412" y="658" class="t label">Operational domains</text>
  <text x="414" y="700" class="sub copy">Inventory, deployment, monitoring, security, backups,</text>
  <text x="414" y="734" class="sub copy">incidents, and change governance</text>

  <path class="arrow" d="M702 750v36m-13-13l13 14 13-14"/>

  <!-- Card 4 -->
  <g filter="url(#shadow)">
    <rect x="195" y="790" width="1015" height="154" rx="20" class="card" stroke="#22B3AA"/>
    <rect x="195" y="790" width="15" height="154" rx="13" fill="url(#tealBar)"/>
  </g>
  <circle cx="300" cy="867" r="58" fill="#F4FCFB" stroke="#6ECFC6" stroke-width="1.5"/>
  <g stroke="#168B82" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 850h25v-12c0-6 5-11 11-11s11 5 11 11v12h10"/>
    <path d="M317 850h12c6 0 11 5 11 11s-5 11-11 11h-12v11c0 6-5 11-11 11s-11-5-11-11v-11h-10v18h-25v-18h-11v-22h11v-18h25"/>
  </g>
  <text x="412" y="858" class="t label">Providers &amp; drivers</text>
  <text x="414" y="904" class="sub copy">Replaceable integrations used only across explicit execution boundaries</text>

  <line x1="120" y1="1004" x2="1288" y2="1004" stroke="#58BFD0" stroke-width="2" stroke-dasharray="7 8"/>
  <g filter="url(#shadow)">
    <rect x="310" y="970" width="787" height="70" rx="30" fill="#fff" stroke="#BDD5EA" stroke-width="1.5"/>
  </g>
  <path d="M388 983l20 8v15c0 14-8 25-20 31-12-6-20-17-20-31v-15z" fill="#13869A"/>
  <path d="M378 1006l8 8 13-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="444" y="1018" class="sub" font-size="30">Human approval before consequential mutation</text>
</svg>
