[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cybercore"
version = "0.1.0"
description = "Infrastructure Context & Intelligence Platform runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CyberDJS" }]
dependencies = [
    "jsonschema>=4.23",
    "PyYAML>=6.0.2,<7",
    "rich>=13.9",
    "zstandard>=0.23",
]

[project.optional-dependencies]
orchestration = ["langgraph>=1.2,<2"]
voice-local = [
    "sherpa-onnx>=1.13.6,<2",
    "sounddevice>=0.5.6,<0.6",
]
dev = [
    "build>=1.2,<2",
    "langgraph>=1.2,<2",
    "pyright>=1.1.400,<2",
    "pytest>=8.0,<10",
    "PyYAML>=6.0.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
cybercore = "cybercore.voice_entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cybercore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/cybercore"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
