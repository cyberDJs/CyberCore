version: 1

target_id: interserver-shared-hosting-staging
provider: InterServer
environment_class: staging
status: target_identified_remote_write_blocked

purpose: >-
  Non-production staging target for the CyberCore self-deployment loop.

production_boundary:
  production_domains:
    - eimyherrer.com
  production_document_root: /home/eimyherr/domains/eimyherrer.com/public_html
  production_mutation_allowed: false
  production_credentials_allowed: false
  provider_mutation_allowed_without_explicit_approval: false

staging_identity:
  domain_or_url: https://staging.eimyherrer.com
  document_root: /home/eimyherr/domains/staging.eimyherrer.com/public_html
  public_origin: 162.250.126.107
  authoritative_dns: Cloudflare
  dns_proxy_mode: dns_only
  document_root_non_overlap_verified: true
  deployment_user_scope: UNVERIFIED_BEFORE_FIRST_REMOTE_WRITE
  capability_status: TARGET_IDENTITY_VERIFIED_DEPLOY_PROTOCOL_PENDING

allowed_modes:
  - plan_only
  - dry_run
  - staging_apply_after_explicit_operator_approval

first_write_policy:
  artifact_class: static_two_file_canary
  destination_pattern: cybercore-canary-<run_id>/
  destination_is_direct_child_of_staging_root: true
  overwrite_allowed: false
  symlink_promotion_allowed: false
  reject_existing_destination: true
  reject_symlink_destination: true
  production_wide_credential_reuse_preapproved: false

secret_policy:
  plaintext_secrets_in_repository: denied
  plaintext_secrets_in_chat: denied
  plaintext_secrets_in_drive_or_caser_docs: denied
  approved_secret_locations:
    - os_backed_secret_store
    - approved_external_vault
  proposed_secret_locations_requiring_governance_acceptance:
    - github_environment_secret_interserver_staging
  required_secret_aliases:
    - INTERSERVER_STAGING_HOST
    - INTERSERVER_STAGING_USER
    - INTERSERVER_STAGING_PORT
    - INTERSERVER_STAGING_SSH_KEY_OR_SFTP_PASSWORD

required_preflight:
  - verify_target_is_non_production
  - verify_target_path_is_not_production_document_root
  - verify_deployment_protocol_and_target_capability
  - verify_no_production_credentials_are_reused
  - verify_rollback_method
  - verify_effect_verifier
  - verify_operator_authorization_for_first_remote_write

rollback:
  preferred: no_overwrite_unique_directory_scoped_delete_if_authorized
  future_options:
    - immutable_release_directory_with_current_symlink
    - timestamped_backup_before_overwrite
  block_if_no_rollback_for_nontrivial_change: true

evidence:
  receipt_class: staging_deploy_receipt
  secret_values_allowed: false
  required_fields:
    - run_id
    - timestamp
    - repository
    - source_branch
    - source_commit
    - target_id
    - deploy_mode
    - verifier_result
    - rollback_mode
    - operator_authorization_reference

current_gate_state:
  live_staging_deploy: blocked
  reason: >-
    WB-0033 verified target identity, DNS, TLS, and document-root isolation. The first
    remote write remains blocked until deployment protocol, least-privilege deploy
    identity/credential scope, secret-alias readiness, rollback execution semantics,
    effect verifier, exact source commit, and fresh operator authorization are verified.
