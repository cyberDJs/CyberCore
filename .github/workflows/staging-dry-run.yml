name: Staging dry run

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DRY_RUN_ONLY to validate staging plan without remote write"
        required: true
        type: string
      manifest:
        description: "Manifest path to validate"
        required: false
        default: ".cybercore/deploy/manifests/interserver-staging-plan-only.example.yaml"
        type: string

permissions:
  contents: read

env:
  TARGET_CONTRACT: .cybercore/deploy/staging-targets/interserver-shared-hosting-staging.yaml

jobs:
  validate-plan-only:
    name: validate plan-only staging manifest
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'DRY_RUN_ONLY' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Validate target and manifest
        run: >-
          python scripts/validate_staging_plan.py
          --target "$TARGET_CONTRACT"
          --manifest "${{ inputs.manifest }}"

      - name: Write no-remote-write receipt
        run: |
          mkdir -p dist/staging
          cat > dist/staging/receipt.txt <<'RECEIPT'
          status=PLAN_ONLY_VALIDATED
          remote_write=false
          production_write=false
          secrets_read=false
          RECEIPT

      - name: Show local receipt
        run: cat dist/staging/receipt.txt
