name: Staging Plan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Local-only staging validation mode
        required: true
        default: plan_only
        type: choice
        options:
          - plan_only
          - dry_run
      target:
        description: Non-production staging target
        required: true
        default: interserver-shared-hosting-staging
        type: choice
        options:
          - interserver-shared-hosting-staging

permissions:
  contents: read

jobs:
  plan:
    name: staging-plan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - name: Validate local staging plan
        run: |
          mkdir -p evidence
          .venv/bin/python -m cybercore.deployment.staging \
            --target ".cybercore/deploy/staging-targets/${{ inputs.target }}.yaml" \
            --mode "${{ inputs.mode }}" \
            --run-id "github-${{ github.run_id }}-${{ github.run_attempt }}" \
            --repository "${{ github.repository }}" \
            --source-branch "${{ github.ref_name }}" \
            --source-commit "${{ github.sha }}" \
            --artifact-identity "source-tree:${{ github.sha }}" \
            --evidence-destination "evidence/staging-manifest.json" \
            --output "evidence/staging-manifest.json"
      - name: Upload safe plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-plan-${{ github.run_id }}
          path: evidence/staging-manifest.json
          if-no-files-found: error
