name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
      - name: Compile sources and tests
        run: .venv/bin/python -m compileall -q src tests

  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: .venv/bin/python -m ruff check src tests
      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check src tests
      - name: Pyright
        run: .venv/bin/python -m pyright

  package:
    name: package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Build distributions
        run: .venv/bin/python -m build
      - name: Inspect build artifacts
        run: |
          test -f dist/cybercore-0.1.0-py3-none-any.whl
          test -f dist/cybercore-0.1.0.tar.gz
      - name: Smoke test built wheel
        run: |
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/python" -m pip install --upgrade pip
          "$tmpdir/venv/bin/python" -m pip install dist/cybercore-0.1.0-py3-none-any.whl
          outside="$tmpdir/outside"
          mkdir "$outside"
          (
            cd "$outside"
            "$tmpdir/venv/bin/cybercore" --help
            "$tmpdir/venv/bin/python" -m cybercore --help
          )
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cybercore-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
