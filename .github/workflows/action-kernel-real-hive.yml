name: Action Kernel real CyberHIVE contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-hive-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CyberCore
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout pinned CyberHIVE
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: cyberDJs/CyberHIVE
          ref: 0838b6a9d8f6f614ef7cd678335a82a899946aa5
          path: .integration-cyberhive
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10"
      - name: Verify real CyberHIVE local registry contract
        env:
          PYTHONPATH: src:.integration-cyberhive/src
        run: python -m pytest -q integration_tests/test_real_hive_node_agent.py
