name: WB-0035 InterServer A1 catalog and quote

on:
  push:
    branches:
      - wb-0035-interserver-vps-vikunja-plan
    paths:
      - .github/workflows/wb0035-interserver-a1.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: wb0035-interserver-a1
  cancel-in-progress: false

jobs:
  authorized-a1:
    name: authorized read-only catalog and quote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INTERSERVER_API_KEY: ${{ secrets.INTERSERVER_API_KEY }}
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install CyberCore
        run: python -m pip install -e .

      - name: Require existing runtime credential alias
        id: credential
        shell: bash
        run: |
          if [ -z "${INTERSERVER_API_KEY:-}" ]; then
            echo "WB-0035 A1 BLOCKED: GitHub Actions secret INTERSERVER_API_KEY is not configured."
            echo "No provider call, order, payment, DNS, SSH, or application mutation was attempted."
            exit 78
          fi

      - name: Run authorized A1 provider probe
        id: probe
        if: ${{ steps.credential.outcome == 'success' }}
        run: python scripts/run_wb0035_interserver_a1.py --out-dir dist/wb0035-a1

      - name: Validate sanitized live quote against WB-0035 plan
        id: validate
        if: ${{ steps.probe.outcome == 'success' }}
        run: >-
          python scripts/validate_vps_plan.py
          --plan .cybercore/provisioning/interserver-vps-plan.example.yaml
          --quote dist/wb0035-a1/interserver-vps-quote.live.json

      - name: Build safe A1 status report
        if: ${{ always() }}
        shell: bash
        env:
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist/wb0035-status
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          credential = os.environ.get("CREDENTIAL_OUTCOME", "unknown")
          probe = os.environ.get("PROBE_OUTCOME", "unknown")
          validate = os.environ.get("VALIDATE_OUTCOME", "unknown")
          head = os.environ.get("HEAD_SHA", "unknown")
          quote_path = Path("dist/wb0035-a1/interserver-vps-quote.live.json")

          lines = [
              "## WB-0035 A1 runtime result",
              "",
              f"Exact head: `{head}`",
              "",
          ]

          if credential != "success":
              lines.extend([
                  "**BLOCKED — runtime credential alias unavailable.**",
                  "",
                  "`INTERSERVER_API_KEY` is not configured for this GitHub Actions runtime. No authenticated InterServer call was made.",
              ])
          elif probe != "success":
              lines.extend([
                  "**BLOCKED — authorized A1 provider probe did not produce a verified quote.**",
                  "",
                  "The probe failed closed. No order or payment action exists in this workflow.",
              ])
          elif validate != "success" or not quote_path.exists():
              lines.extend([
                  "**BLOCKED — sanitized live quote failed the WB-0035 plan gate.**",
                  "",
                  "No purchase or payment is authorized.",
              ])
          else:
              quote = json.loads(quote_path.read_text(encoding="utf-8"))
              resources = quote["resources"]
              lines.extend([
                  "**VERIFIED — authenticated catalog + non-mutating quote completed.**",
                  "",
                  f"- Platform: `{quote['platform']}`, slices: `{quote['slices']}`",
                  f"- OS: `{quote['os_distro']} {quote['os_version']}`",
                  f"- Recurring price: **USD {quote['recurring_price_usd_month']}/month**",
                  f"- One-time cost: **USD {quote['one_time_price_usd']}**",
                  f"- RAM: `{resources['ram_mib']} MiB`, disk: `{resources['disk_gib']} GiB`",
                  f"- Stock available: `{quote['stock_available']}`",
                  f"- Hostname candidate: `{quote['public_hostname']}`",
                  f"- Safe quote reference: `{quote['quote_reference']}`",
              ])

          lines.extend([
              "",
              "Safety receipt: `order_performed=false`, `payment_performed=false`, `provider_mutation_performed=false`, `secret_values_recorded=false`.",
              "",
              "A2 purchase/payment, A3 bootstrap/deploy and A4 DNS remain not authorized.",
          ])

          Path("dist/wb0035-status/pr-comment.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload sanitized A1 evidence
        if: ${{ steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wb0035-a1-interserver-quote
          path: dist/wb0035-a1/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Report safe result to PR 61
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 61 --repo cyberDJs/CyberCore --body-file dist/wb0035-status/pr-comment.md
