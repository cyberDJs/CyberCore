# CyberCore #113 Phase-B candidate: append to the END of primary sshd_config.
# NEVER place this block under an early Include before global directives.
Match User cybercore-exec
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    ForceCommand /usr/bin/python3 /usr/local/libexec/cybercore-exec/dispatcher.py cyberskills-vps
