Subsystem cybercore-exec /usr/bin/python3 /usr/local/libexec/cybercore-exec/nextcloud_dispatcher.py

Match User cybercore-exec
    ForceCommand /usr/bin/python3 /usr/local/libexec/cybercore-exec/nextcloud_dispatcher.py
    PermitTTY no
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no

Match all
