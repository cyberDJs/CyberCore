# Candidate CyberSkills VPS execution endpoint for issue #113. Not deployed by this PR.
# The subsystem is target-bound and does not expose an interactive shell.

Subsystem cybercore-exec /usr/bin/python3 /usr/local/libexec/cybercore-exec/dispatcher.py cyberskills-vps

Match User cybercore-exec
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    ForceCommand /usr/bin/python3 /usr/local/libexec/cybercore-exec/dispatcher.py cyberskills-vps

Match all
